; Supervisor config for league-desktop. @TOKENS@ are filled in by install.sh.

[supervisord]
nodaemon=false
logfile=/tmp/league-desktop/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=/tmp/league-desktop/supervisord.pid
childlogdir=/tmp/league-desktop
user=root

[unix_http_server]
file=/tmp/league-desktop/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/league-desktop/supervisor.sock

; --- X server with a built-in VNC server on DISPLAY :1, RFB on localhost:5901 ---
[program:xvnc]
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_DESKTOP_RESOLUTION)s -depth @DEPTH@ -dpi 96
    -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared -desktop League
user=@USER@
environment=HOME="@HOME@",USER="@USER@"
priority=10
autorestart=true
startsecs=2
stdout_logfile=/tmp/league-desktop/xvnc.log
redirect_stderr=true

; --- Window manager ---
[program:fluxbox]
command=/usr/bin/fluxbox
user=@USER@
environment=HOME="@HOME@",USER="@USER@",DISPLAY=":1"
priority=20
autorestart=true
startretries=10
stdout_logfile=/tmp/league-desktop/fluxbox.log
redirect_stderr=true

; --- noVNC web client + websocket proxy, with a ping so idle sockets survive ---
[program:websockify]
command=/usr/bin/websockify --heartbeat=@HEARTBEAT@ --web /usr/share/novnc @WEBPORT@ localhost:5901
priority=30
autorestart=true
stdout_logfile=/tmp/league-desktop/websockify.log
redirect_stderr=true
